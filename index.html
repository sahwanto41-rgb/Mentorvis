salah dewan guru.`,`Wawancara mendalam terkait penanaman Pola Pikir Bertumbuh (Growth Mindset) di kalangan guru dan tenaga kependidikan.`,`Eksplorasi praktik kewirausahaan sekolah dalam mengatasi keterbatasan sumber daya secara kreatif dan akuntabel.`,`Analisis kasus pengambilan keputusan kepala sekolah saat menghadapi dilema etika atau bujukan moral.`],lkList:[`LK-3A-GROWTH-MINDSET`,`LK-3B-GROWTH-MINDSET-PLAN`,`LK-4-GROWTH-MINDSET-DECISION`,`LK-1.3.1-SHADOWING`,`LK-KEWIRAUSAHAAN`,`LK-PENGAMBILAN-KEPUTUSAN`],reflectiveFocus:`Bagaimana kepala sekolah mentor mengedepankan keteladanan kepribadian dan pola pikir bertumbuh dalam membangun rasa saling percaya warga sekolah?`},{dayNumber:2,totalJp:8,title:`Pengelolaan Sekolah Jilid 1 (Visioning & Perencanaan Berbasis Data)`,subtitle:`Membongkar Praktik Baik Visioning Sekolah, Eksplorasi Rapor Pendidikan, dan Penyusunan RKS/RKAS`,competencyFocus:[`Manajerial`,`Sosial`],timeBreakdown:[{activity:`Paparan Profil Visioning & Budaya PBD Sekolah`,durationJp:1,durationMinutes:45,description:`Pemaparan kepala sekolah mentor tentang bagaimana visi-misi diturunkan dari kondisi riil dan aspirasi warga sekolah.`},{activity:`Diskusi Kasus Pengelolaan & Perumusan Solusi`,durationJp:2,durationMinutes:90,description:`Membedah kasus pengelolaan nyata: cara mentor menyelesaikan ketidaksesuaian prioritas program dengan pagu anggaran.`},{activity:`Studi Dokumen Rapor Pendidikan, RKS, & RKAS / Observasi`,durationJp:2,durationMinutes:90,description:`Mencermati dokumen Rapor Pendidikan, lembar Identifikasi-Refleksi-Benahi (IRB), dan dokumen RKS/RKAS yang telah disahkan.`},{activity:`Refleksi Mendalam di Tempat Pelatihan (FGD Kelompok)`,durationJp:3,durationMinutes:135,description:`Kembali ke tempat pelatihan untuk analisis mendalam bersama Pengajar Diklat dan penyusunan bahan presentasi kelompok.`}],mainActivities:[`Menelaah bagaimana KS mentor menerjemahkan indikator prioritas Rapor Pendidikan menjadi program nyata.`,`Mencermati proses sinkronisasi perencanaan berbasis data (PBD) ke dalam lembar kerja ARKAS.`,`Mewawancarai Tim Pengembang Sekolah (TPS) mengenai keterlibatan guru dan komite dalam penyusunan RKS.`,`Mengidentifikasi praktik baik penyusunan visi-misi yang hidup (bukan sekadar pajangan dinding).`],lkList:[`LK-2.6-PENGELOLAAN-JILID-1`,`LK-PANDUAN-DUDI-SMK`],isSmkSpecial:!0,smkNote:`Catatan Khusus SMK: Hari ke-2 melaksanakan Kunjungan DUDI (Paparan 1 JP, Diskusi 2 JP, Studi dokumen 2 JP, Refleksi 3 JP) menggunakan instrumen Panduan Kunjungan BCKS-DUDI untuk sinkronisasi kurikulum, TeFa, PKL, dan serapan lulusan.`,reflectiveFocus:`Bagaimana kepala sekolah mentor mengarahkan pengambilan keputusan manajerial secara objektif berbasis data (PBD) tanpa resistensi internal?`},{dayNumber:3,totalJp:8,title:`Pengelolaan Sekolah Jilid 2 (Sumber Daya, Pemantauan, & Evaluasi)`,subtitle:`Fokus pada Tata Kelola SDM, Sarana Prasarana, Akuntabilitas Anggaran, dan Sistem Monev`,competencyFocus:[`Manajerial`,`Sosial`,`Kewirausahaan`],timeBreakdown:[{activity:`Paparan Profil Tata Kelola Aset & Program Monev`,durationJp:1,durationMinutes:45,description:`Menyimak strategi mentor dalam memetakan 7 aset modal sekolah dan siklus pemantauan berkala.`},{activity:`Diskusi Praktik Baik Manajemen Konflik & Kinerja PTK`,durationJp:2,durationMinutes:90,description:`Mendiskusikan instrumen penilaian kinerja guru/tendik, pembagian tugas berbasis talenta, serta penanganan kendala sarpras.`},{activity:`Studi Dokumen Aset, Sarpras, & Laporan Monev Internal`,durationJp:2,durationMinutes:90,description:`Memeriksa dokumen inventarisasi sarpras, SOP pemeliharaan, serta instrumen monev program kerja sekolah.`},{activity:`Refleksi di Tempat Pelatihan (FGD & Persiapan Pelaporan)`,durationJp:3,durationMinutes:135,description:`FGD intensif merumuskan rekomendasi adaptasi manajerial dan pemetaan keselarasan RKS dengan realisasi.`}],mainActivities:[`Observasi langsung pengelolaan sarana prasarana sekolah dan tata ruang yang berpusat pada keselamatan dan kenyamanan murid.`,`Studi dokumen sistem monitoring dan evaluasi berkala yang dijalankan kepala sekolah mentor.`,`Mempelajari strategi pelibatan komite dan alumni dalam pengadaan serta perawatan fasilitas sekolah.`,`Menganalisis mekanisme pemberian apresiasi dan pembinaan berkelanjutan bagi pendidik dan tenaga kependidikan.`],lkList:[`LK-2.7-PENGELOLAAN-JILID-2`],isSmkSpecial:!0,smkNote:`Catatan Khusus SMK: Hari ke-3 mengkaji Pengelolaan Sekolah Jilid 1 dan Jilid 2 sekaligus menggunakan Form LK 2.6 dan LK 2.7.`,reflectiveFocus:`Apa strategi kunci kepala sekolah mentor dalam memastikan setiap rupiah anggaran dan setiap aset sarana prasarana berdampak nyata pada mutu belajar murid?`},{dayNumber:4,totalJp:6,title:`Supervisi Akademik & Pendampingan Guru (Coaching)`,subtitle:`Mengamati Siklus Supervisi Akademik Berkelanjutan: Pra-Observasi, Observasi Kelas, & Pasca-Observasi Alur TIRTA`,competencyFocus:[`Supervisi`,`Kepribadian`,`Sosial`],timeBreakdown:[{activity:`Mengamati Pelaksanaan Supervisi Akademik / Coaching`,durationJp:2,durationMinutes:90,description:`Shadowing kepala sekolah mentor saat memfasilitasi percakapan pra-observasi, observasi pembelajaran, atau pasca-observasi berbasis coaching.`},{activity:`Diskusi Mendalam mengenai Pendekatan Supervisi Humanis`,durationJp:2,durationMinutes:90,description:`Mendiskusikan bagaimana mentor menghilangkan stigma bahwa supervisi adalah ajang mencari kesalahan guru.`},{activity:`Wawancara Guru yang Disupervisi & Studi Dokumen Supak`,durationJp:1,durationMinutes:45,description:`Mewawancarai guru tentang dampak coaching supervisi terhadap kemerdekaan mengajarnya, serta memeriksa rekapitulasi tindak lanjut PKB.`},{activity:`Refleksi Akhir & Finalisasi Laporan Singkat LMS`,durationJp:1,durationMinutes:45,description:`Penyimpulan 20 JP kunjungan sekolah, merumuskan komitmen kepemimpinan, dan persiapan upload file LK ke LMS.`}],mainActivities:[`Mengamati teknik komunikasi memberdayakan (coaching) yang dipraktikkan kepala sekolah mentor.`,`Menganalisis instrumen pra-observasi, lembar observasi pembelajaran berdiferensiasi, dan catatan tindak lanjut.`,`Mendalami strategi kepala sekolah mentor dalam menindaklanjuti hasil supervisi menjadi program Pengembangan Keprofesian Berkelanjutan (PKB).`,`Merangkum seluruh pembelajaran 20 JP menjadi Laporan Singkat Kunjungan Sekolah siap unggah ke LMS.`],lkList:[`LK-INSTRUMEN-SUPAK`,`LK-5.2.1-STUDI-SUPAK`],reflectiveFocus:`Bagaimana kepala sekolah mentor mengubah paradigma supervisi dari pengawasan administratif menjadi kemitraan reflektif yang menumbuhkan potensi guru?`}],x=[{id:`strat-1`,number:1,name:`Shadowing (Membayangi / Pengamatan Melekat)`,shortDescription:`Mengamati tindakan nyata kepala sekolah mentor secara langsung tanpa interupsi saat menjalankan peran kepemimpinan.`,fullDescription:`Shadowing adalah teknik pengamatan melekat di mana BCKS mendampingi dan mengamati secara hening tindakan, bahasa tubuh, gaya komunikasi, serta keputusan spontan yang diambil oleh kepala sekolah mentor dalam situasi kerja sebenarnya (seperti memimpin rapat dewan guru, menyapa siswa 5S di gerbang, menyelesaikan komplain orang tua, atau melakukan supervisi).`,practicalSteps:[`Posisikan diri di tempat yang strategis namun tidak mengganggu jalannya kegiatan/rapat.`,`Fokus mencatat: kalimat pembuka, cara mentor meredakan ketegangan, teknik mendengarkan aktif, dan cara merumuskan kesepakatan bersama.`,`Perhatikan bagaimana kepala sekolah merespons perbedaan pendapat di antara guru.`,`Tulis catatan faktual (apa yang diucapkan dan dilakukan), hindari membuat kesimpulan menghakimi.`],dos:[`Jaga keheningan dan netralitas selama kegiatan berlangsung.`,`Catat kutipan langsung (verbatim) kalimat inspiratif yang diucapkan kepala sekolah.`,`Perhatikan ekspresi dan respon para guru terhadap kepemimpinan mentor.`],donts:[`Jangan memotong pembicaraan atau menginterupsi jalannya rapat.`,`Jangan memberikan komentar atau penilaian langsung di hadapan warga sekolah.`,`Jangan mengambil foto/video tanpa izin PIC dan Kepala Sekolah Mentor.`],sampleQuestions:[`Apa yang menjadi pertimbangan utama Ibu/Bapak saat memilih kata-kata tersebut untuk meredakan kekhawatiran dewan guru?`,`Bagaimana cara Ibu/Bapak mempersiapkan kondisi mental sebelum memimpin rapat pengambilan keputusan yang sulit?`],suitableLks:[`LK-1.3.1-SHADOWING`,`LK-INSTRUMEN-SUPAK`,`LK-4-GROWTH-MINDSET-DECISION`]},{id:`strat-2`,number:2,name:`Kolaborasi Inkuiri`,shortDescription:`Bersama mentor mencermati data sekolah untuk mengidentifikasi akar masalah, merencanakan, dan menentukan tindak lanjut.`,fullDescription:`Kolaborasi Inkuiri merupakan proses penyelidikan bersama antara BCKS dan Kepala Sekolah Mentor terhadap data autentik sekolah (seperti Rapor Pendidikan, data absensi, data literasi/numerasi, atau rekap supervisi) untuk memahami proses penalaran logis kepala sekolah dalam menemukan akar masalah dan merumuskan intervensi benahi.`,practicalSteps:[`Buka dokumen Rapor Pendidikan atau data kinerja sekolah bersama mentor.`,`Minta mentor menceritakan kisah di balik angka capaian (konteks kualitatif).`,`Cermati bagaimana mentor menghubungkan indikator input, proses, dan output.`,`Pelajari bagaimana mentor memprioritaskan 1-2 program Benahi yang berdaya ungkit tinggi.`],dos:[`Tunjukkan ketertarikan pada proses berpikir (thinking process) kepala sekolah mentor.`,`Tanyakan data pendukung lain yang digunakan mentor selain angka kuantitatif.`,`Hargai kearifan lokal yang mendasari pemilihan intervensi sekolah.`],donts:[`Jangan memperdebatkan keabsahan data sekolah mentor.`,`Jangan membandingkan angka capaian sekolah mentor dengan sekolah asal secara peyoratif.`,`Jangan memaksakan model solusi dari luar yang belum tentu relevan.`],sampleQuestions:[`Ketika melihat indikator literasi pada tahun lalu, langkah inkuiri apa yang pertama kali Ibu/Bapak lakukan bersama dewan guru?`,`Bagaimana cara Ibu/Bapak memastikan bahwa akar masalah yang ditetapkan benar-benar menyentuh kebutuhan belajar murid?`],suitableLks:[`LK-2.6-PENGELOLAAN-JILID-1`,`LK-2.7-PENGELOLAAN-JILID-2`]},{id:`strat-3`,number:3,name:`FGD (Focus Group Discussion)`,shortDescription:`Mendiskusikan kasus nyata yang pernah dihadapi dan berhasil diselesaikan oleh mentor bersama tim sekolah.`,fullDescription:`Diskusi kelompok terfokus antara BCKS, Kepala Sekolah Mentor, dan perwakilan dewan guru atau Tim Pengembang Sekolah. Tujuannya adalah membedah secara mendalam sebuah peristiwa nyata—misalnya resistensi kurikulum baru, penurunan motivasi belajar, atau penataan sarpras—untuk mengungkap strategi kolektif yang berhasil diterapkan.`,practicalSteps:[`Tetapkan satu topik kasus sukses (success story) yang disepakati bersama mentor.`,`Dengarkan berbagai perspektif: bagaimana sudut pandang KS, guru senior, dan guru penggerak.`,`Catat faktor pendorong keberhasilan (enablers) dan cara tim mengatasi hambatan di lapangan.`,`Simpulkan pelajaran kepemimpinan yang dapat direplikasi.`],dos:[`Ciptakan suasana diskusi yang hangat, setara, dan apresiatif.`,`Ajukan pertanyaan terbuka yang menggali emosi, strategi, dan nilai kebajikan.`,`Apresiasi setiap masukan dari guru sekolah mentor yang hadir.`],donts:[`Jangan mendominasi jalannya FGD dengan menceritakan pengalaman pribadi sekolah sendiri.`,`Jangan menyudutkan salah satu pihak jika dalam kasus ada ketidaksepakatan masa lalu.`],sampleQuestions:[`Apa titik balik yang membuat dewan guru akhirnya bersatu mendukung inovasi tersebut?`,`Bagaimana kepala sekolah menjaga stamina dan komitmen tim ketika program menemui jalan buntu?`],suitableLks:[`LK-PENGAMBILAN-KEPUTUSAN`,`LK-KEWIRAUSAHAAN`,`LK-2.6-PENGELOLAAN-JILID-1`]},{id:`strat-4`,number:4,name:`Wawancara Mendalam (In-Depth Interview)`,shortDescription:`Wawancara terstruktur dan empatik untuk menggali kompetensi kepribadian, sosial, kewirausahaan, dan manajerial.`,fullDescription:`Wawancara tatap muka dengan kepala sekolah mentor, guru, komite, atau siswa untuk mengonfirmasi dan memperdalam temuan pengamatan. Kunci wawancara BCKS adalah menggunakan pertanyaan berbasis apresiatif (Appreciative Inquiry) yang memancing refleksi mendalam, bukan interogasi.`,practicalSteps:[`Siapkan pedoman wawancara berbasis instrumen LK sebelum sesi dimulai.`,`Awali dengan apresiasi tulus atas sambutan hangat sekolah mentor.`,`Gunakan teknik probing: "Bisa diceritakan lebih lanjut contoh nyatanya, Bu/Pak?"`,`Catat poin penting dan rangkum pemahaman secara berkala untuk konfirmasi.`],dos:[`Tunjukkan kontak mata ramah, anggukan empatik, dan sikap menyimak aktif.`,`Gunakan bahasa santun dan menghargai kesibukan kepala sekolah mentor.`,`Minta izin secara sopan jika hendak merekam suara atau mencatat.`],donts:[`Hindari pertanyaan menguji seperti ujian lisan.`,`Hindari nada meragukan jawaban mentor.`,`Jangan melampaui waktu yang telah dialokasikan dalam skenario harian.`],sampleQuestions:[`Bagaimana Ibu/Bapak merawat semangat keteladanan diri saat menghadapi situasi penuh tekanan?`,`Nilai kebajikan utama apa yang selalu menjadi kompas Ibu/Bapak saat harus mengambil keputusan yang tidak populer?`],suitableLks:[`LK-3A-GROWTH-MINDSET`,`LK-3B-GROWTH-MINDSET-PLAN`,`LK-KEWIRAUSAHAAN`,`LK-INSTRUMEN-SUPAK`]},{id:`strat-5`,number:5,name:`Observasi Lingkungan & Budaya Sekolah`,shortDescription:`Pengamatan langsung terhadap lingkungan fisik, iklim sekolah, interaksi sosial, dan hasil pengelolaan nyata.`,fullDescription:`Pengamatan sensorik menyeluruh terhadap suasana sekolah: bagaimana murid dan guru saling berinteraksi saat pembiasaan pagi (5S: Senyum, Sapa, Salam, Sopan, Santun), penataan sudut baca, keteraturan laboratorium, kebersihan toilet, pajangan karya murid, hingga papan transparansi dana BOS.`,practicalSteps:[`Lakukan pengamatan di titik-titik krusial: pintu gerbang pagi hari, selasar kelas, ruang guru, perpustakaan, dan kantin.`,`Catat bukti fisik yang mencerminkan visi misi sekolah hidup dalam keseharian.`,`Amati ekspresi keceriaan murid dan rasa aman dalam belajar.`,`Dokumentasikan sistem tanda (signage) dan aksesibilitas bagi murid inklusif bila ada.`],dos:[`Amati perilaku spontan warga sekolah, bukan yang dibuat-buat.`,`Perhatikan detail kecil seperti kebersihan tempat wudhu atau kerapian pojok baca.`,`Sapa murid dan guru dengan ramah ketika berpapasan di lingkungan sekolah.`],donts:[`Jangan mengganggu proses pembelajaran di dalam kelas saat berkeliling.`,`Jangan memotret siswa secara close-up yang melanggar perlindungan anak.`],sampleQuestions:[`Bagaimana proses membiasakan budaya 5S ini sehingga berjalan secara mandiri tanpa harus diawasi terus-menerus?`,`Bagaimana sekolah melibatkan komite dan paguyuban kelas dalam menata pojok baca kelas?`],suitableLks:[`LK-1.3.1-SHADOWING`,`LK-2.7-PENGELOLAAN-JILID-2`]},{id:`strat-6`,number:6,name:`Studi Kasus (Case Study Analysis)`,shortDescription:`Membedah dilema atau tantangan kompleks spesifik yang pernah dihadapi dan diselesaikan oleh mentor.`,fullDescription:`Metode analitis di mana BCKS mendalami satu kasus kepemimpinan spesifik: misalnya kasus penurunan kepercayaan masyarakat, konflik internal pendidik, penanganan siswa rentan putus sekolah, atau penyesuaian kurikulum. Kasus ini dianalisis dengan kerangka 4 Paradigma, 3 Prinsip, dan 9 Langkah Pengambilan Keputusan.`,practicalSteps:[`Pilih satu kasus inspiratif yang pernah diselesaikan oleh kepala sekolah mentor.`,`Petakan siapa aktor yang terlibat, kepentingan yang bertentangan, dan nilai kebajikan yang saling bersinggungan.`,`Analisis opsi investigasi trilema yang berhasil ditemukan mentor.`,`Ambil pelajaran mengenai keberanian mengambil risiko demi kepentingan terbaik murid.`],dos:[`Hormati kerahasiaan identitas pihak-pihak dalam kasus (anonimkan jika sensitif).`,`Fokus pada resolusi damai dan kebijaksanaan kepemimpinan yang ditunjukkan.`],donts:[`Jangan menghakimi pihak yang berkonflik di masa lalu.`,`Jangan menyebarkan rincian kasus ke publik atau media sosial.`],sampleQuestions:[`Apa pertimbangan etika terbesar yang membuat Ibu/Bapak akhirnya memilih jalan penyelesaian tersebut?`,`Bagaimana Ibu/Bapak memulihkan hubungan kerja antar-guru setelah konflik berhasil diselesaikan?`],suitableLks:[`LK-PENGAMBILAN-KEPUTUSAN`,`LK-4-GROWTH-MINDSET-DECISION`]},{id:`strat-7`,number:7,name:`Studi Dokumen (Documentary Study)`,shortDescription:`Mencermati dokumen-dokumen resmi perencanaan, supervisi, tata kelola, dan instrumen monev sekolah mentor.`,fullDescription:`Pemeriksaan cermat terhadap dokumen autentik sekolah, seperti: Kurikulum Operasional Satuan Pendidikan (KOSP), Dokumen RKS 4 tahunan, RKAS tahunan, SK Penugasan Guru, Instrumen dan Rekap Supervisi Akademik, Program PKB, serta MoU Kemitraan (DUDI bagi SMK).`,practicalSteps:[`Minta izin secara sopan untuk melihat dokumen yang telah disiapkan mentor.`,`Cermati benang merah antara Visi Misi -> Rapor Pendidikan -> RKS -> RKAS -> Program Supervisi.`,`Perhatikan format instrumen yang digunakan: apakah memuat kriteria yang terukur dan memerdekakan.`,`Catat contoh redaksi instrumen atau SOP yang sangat efektif dan dapat diadaptasi.`],dos:[`Perlakukan dokumen sekolah mentor dengan penuh tanggung jawab dan kehati-hatian.`,`Minta penjelasan mentor jika menemukan istilah atau kode program internal yang belum dipahami.`],donts:[`Jangan membawa pulang dokumen asli tanpa izin tertulis dari pihak sekolah.`,`Jangan memfoto dokumen rahasia keuangan yang sifatnya privat.`],sampleQuestions:[`Bagaimana mekanisme sekolah menjaga kesinambungan antara dokumen RKS empat tahunan dengan RKAS tahun berjalan?`,`Dokumen apa yang paling sering Ibu/Bapak jadikan rujukan saat melakukan evaluasi tengah tahun?`],suitableLks:[`LK-2.6-PENGELOLAAN-JILID-1`,`LK-2.7-PENGELOLAAN-JILID-2`,`LK-5.2.1-STUDI-SUPAK`,`LK-PANDUAN-DUDI-SMK`]},{id:`strat-8`,number:8,name:`Simulasi & Partisipasi Aktif`,shortDescription:`Mengikuti simulasi rapat, mengamati simulasi supervisi, atau mempraktikkan alur pembiasaan bersama mentor.`,fullDescription:`Strategi di mana BCKS terlibat aktif dalam kegiatan simulasi atau role-playing bersama kepala sekolah mentor dan rekan sejawat: misalnya mensimulasikan percakapan pasca-observasi dengan alur coaching TIRTA, atau mensimulasikan penanganan komplain orang tua.`,practicalSteps:[`Ambil peran aktif sebagai pengamat reflektif atau mitra latihan coaching.`,`Gunakan rubrik kompetensi untuk memberikan umpan balik yang membangun kepada rekan sesama BCKS.`,`Minta mentor memberikan keteladanan (modeling) bagaimana merespons gestur guru yang cemas.`,`Refleksikan kenyamanan dan tantangan saat mempraktikkan keterampilan tersebut.`],dos:[`Tunjukkan keterbukaan untuk menerima masukan atas performa simulasi diri.`,`Dukung rekan sekelompok dalam membangun rasa percaya diri memimpin.`],donts:[`Jangan bersikap kaku atau takut salah selama simulasi.`,`Jangan menilai rendah performa rekan sejawat.`],sampleQuestions:[`Berdasarkan pengamatan Ibu/Bapak atas simulasi kami tadi, pada aspek mana penjiwaan coaching kami perlu diasah lagi?`,`Bagaimana cara mentor menjaga agar tidak terjebak memberi nasihat langsung (mentoring) saat sedang melakukan coaching supervisi?`],suitableLks:[`LK-INSTRUMEN-SUPAK`,`LK-3B-GROWTH-MINDSET-PLAN`]}],S=[{id:`LK-3A-GROWTH-MINDSET`,code:`Revisi LK-3a_PPB_BCKS_2026`,title:`Refleksi Pola Pikir Bertumbuh (Growth Mindset) BCKS`,dayNumber:1,category:`Kepribadian & Pola Pikir`,competencies:[`Kepribadian`,`Kewirausahaan`],description:`Menganalisis konsep dan keyakinan diri mengenai Pola Pikir Bertumbuh (Growth Mindset) yang diamati dari keteladanan kepala sekolah mentor dalam memimpin sekolah dan merespons kegagalan.`,specificPrompts:{memahamiPrompt:`Jelaskan pemahaman Anda mengenai perbedaan pola pikir tetap (fixed mindset) vs pola pikir bertumbuh (growth mindset) yang ditunjukkan oleh KS mentor saat menghadapi tantangan di sekolah.`,mengaplikasiPrompt:`Deskripsikan tindakan nyata dan kalimat-kalimat apresiatif yang diucapkan KS mentor kepada guru/siswa yang mencerminkan keyakinan bahwa potensi dapat terus bertumbuh.`,merefleksiPrompt:`Refleksikan keyakinan diri Anda sebagai calon kepala sekolah: keyakinan lama apa yang perlu Anda ubah agar dapat membangun ekosistem sekolah bertumbuh di sekolah masa depan?`},samplePractice:`Kepala sekolah mentor menyikapi penurunan capaian numerasi bukan dengan memarahi guru, melainkan mengajak guru MGMP/KKG menganalisis proses belajar dan memberikan ruang eksperimen metode baru.`},{id:`LK-3B-GROWTH-MINDSET-PLAN`,code:`Revisi LK-3b_PPB_BCKS_2026`,title:`Rencana Pengembangan Pola Pikir Bertumbuh untuk Warga Sekolah`,dayNumber:1,category:`Kepribadian & Budaya Sekolah`,competencies:[`Kepribadian`,`Sosial`,`Manajerial`],description:`Menyusun rencana strategis konkret untuk menumbuhkan budaya Growth Mindset di kalangan pendidik, tenaga kependidikan, dan murid terinspirasi dari praktik baik sekolah mentor.`,specificPrompts:{memahamiPrompt:`Pahami bagaimana kepala sekolah mentor menanamkan nilai bahwa kesalahan adalah bagian dari proses belajar (learning from mistakes).`,mengaplikasiPrompt:`Bagaimana langkah konkret mentor dalam membiasakan umpan balik yang konstruktif dan menumbuhkan rasa percaya diri guru dalam mencoba inovasi pembelajaran?`,merefleksiPrompt:`Rencana aksi apa yang akan Anda rancang untuk sekolah Anda dalam 100 hari pertama kepemimpinan guna mengubah kebiasaan saling menyalahkan menjadi saling memberdayakan?`},samplePractice:`Pemberian rubrik umpan balik berbasis proses belajar di papan display sekolah dan program mingguan "Apresiasi Praktik Baik Guru" dalam apel Senin.`},{id:`LK-4-GROWTH-MINDSET-DECISION`,code:`Revisi LK-4_PPB_BCKS_2026`,title:`Aplikasi Pola Pikir Bertumbuh dalam Pengambilan Keputusan`,dayNumber:1,category:`Kepribadian & Pengambilan Keputusan`,competencies:[`Kepribadian`,`Kewirausahaan`,`Manajerial`],description:`Menganalisis resiliensi dan kelincahan berpikir (cognitive agility) kepala sekolah mentor saat harus mengambil keputusan sulit di tengah keterbatasan atau resistensi.`,specificPrompts:{memahamiPrompt:`Pahami dilema atau tantangan kompleks yang pernah dihadapi kepala sekolah mentor serta dasar filosofis yang digunakannya untuk tetap optimis.`,mengaplikasiPrompt:`Bagaimana kepala sekolah mentor mengomunikasikan keputusan tersebut kepada pihak yang awalnya menentang dengan tetap menjaga hubungan baik?`,merefleksiPrompt:`Pelajaran berharga apa yang Anda petik tentang ketegasan yang berbalut empati dan bagaimana Anda akan melatih ketenangan batin saat menghadapi dilema serupa?`},samplePractice:`Kepala sekolah mentor tetap melanjutkan program digitalisasi pembelajaran meskipun ada penolakan dari guru senior, dengan cara menyediakan pendamping guru sebaya secara sabar tanpa mencela.`},{id:`LK-1.3.1-SHADOWING`,code:`LK 1.3.1_KP 3_SHADOWING`,title:`Keteladanan Kepala Sekolah (Pengamatan Rapat & Komunikasi Etis)`,dayNumber:1,category:`Kepribadian & Kepemimpinan Sosial`,competencies:[`Kepribadian`,`Sosial`,`Supervisi`],description:`Hasil pengamatan melekat (shadowing 90 menit) terhadap keteladanan kepala sekolah mentor saat memimpin rapat penyelesaian masalah dengan dewan guru atau sosialisasi aturan sekolah.`,specificPrompts:{memahamiPrompt:`Apa agenda rapat yang diamati, bagaimana suasana awal rapat, dan nilai-nilai keteladanan apa yang ditunjukkan mentor dalam membuka forum?`,mengaplikasiPrompt:`Deskripsikan teknik komunikasi mentor: bagaimana beliau mendengarkan keluhan guru, mengelola emosi peserta rapat, membagi giliran bicara, dan menyimpulkan solusi bersama.`,merefleksiPrompt:`Refleksikan gaya kepemimpinan rapat Anda saat ini. Perubahan konkret apa yang akan Anda terapkan agar rapat dewan guru menjadi ruang musyawarah yang bermakna dan memotivasi?`},samplePractice:`KS mentor tidak langsung memotong keluhan guru, melainkan mencatat di papan tulis, memvalidasi perasaan guru, lalu membimbing forum menemukan 3 opsi solusi yang disepakati secara aklamasi.`},{id:`LK-KEWIRAUSAHAAN`,code:`LK KUNJUNGAN SEKOLAH KEWIRAUSAHAAN`,title:`Inovasi, Kemitraan, & Pemberdayaan Potensi Sekolah`,dayNumber:1,category:`Kewirausahaan`,competencies:[`Kewirausahaan`,`Manajerial`,`Sosial`],description:`Mengeksplorasi naluri kewirausahaan kepala sekolah mentor dalam mendayagunakan aset sekolah, menjalin kemitraan, dan menciptakan inovasi program yang berdampak pada murid.`,specificPrompts:{memahamiPrompt:`Pahami bagaimana cara kepala sekolah mentor melihat potensi dan modal aset (manusia, fisik, finansial, lingkungan) di tengah keterbatasan anggaran.`,mengaplikasiPrompt:`Jelaskan program inovatif atau kemitraan eksternal (dengan komite, alumni, komunitas, atau sponsor) yang berhasil diinisiasi oleh KS mentor.`,merefleksiPrompt:`Bagaimana Anda akan menumbuhkan pola pikir kewirausahaan (pantang menyerah, kreatif, mencari jalan keluar) tanpa melanggar regulasi tata kelola anggaran sekolah negeri?`},samplePractice:`Memanfaatkan lahan mati sekolah menjadi kebun hidroponik edukatif bekerja sama dengan Dinas Pertanian dan komite sekolah, menghasilkan sayur sehat dan laboratorium alam murid.`},{id:`LK-PENGAMBILAN-KEPUTUSAN`,code:`LK KUNJUNGAN SEKOLAH PENGAMBILAN KEPUTUSAN`,title:`Pengambilan Keputusan Berbasis Nilai-Nilai Kebajikan`,dayNumber:1,category:`Kepribadian & Etika Kepemimpinan`,competencies:[`Kepribadian`,`Manajerial`],description:`Studi kasus pengujian keputusan kepala sekolah mentor mengacu pada 4 paradigma, 3 prinsip pengambilan keputusan, dan 9 langkah pengujian etika.`,specificPrompts:{memahamiPrompt:`Uraikan kasus dilema etika nyata yang dialami KS mentor: paradigma apa yang terjadi (misal: Individu vs Masyarakat, Keadilan vs Kasihan, dsb)?`,mengaplikasiPrompt:`Prinsip apa yang digunakan (Berpikir berbasis hasil akhir, aturan, atau rasa peduli) dan bagaimana langkah-langkah investigasi opsi trilema yang diambil mentor?`,merefleksiPrompt:`Apa hikmah terbesar bagi Anda tentang keberanian memegang teguh nilai kebajikan universal (kejujuran, keselamatan murid, keadilan) saat berada dalam tekanan politik/sosial?`},samplePractice:`Menyelesaikan dilema penerimaan siswa titipan dengan me Anda adalah "BCKS Visitation Assistant", asisten AI profesional dan bijaksana pendamping Peserta Diklat Calon Kepala Sekolah (BCKS) selama melaksanakan kegiatan Kunjungan Sekolah dengan alokasi waktu 20 Jam Pelajaran (JP).

PRINSIP WAJIB:
1. BUKAN DALAM RANGKA MENILAI: Tegaskan selalu bahwa kegiatan kunjungan sekolah BUKAN untuk menilai baik atau buruknya sekolah mentor! Ini wahana belajar untuk memperoleh inspirasi dan referensi nyata dari praktik baik dan keunggulan kepala sekolah mentor.
2. FOKUS PADA PRAKTIK BAIK: Setiap observasi difokuskan pada keteladanan, strategi solutif, kearifan lokal, dan inovasi kepala sekolah mentor.
3. TIGA TAHAP PEMBELAJARAN MENDALAM: Setiap analisis dan pengisian Lembar Kerja (LK) WAJIB menggunakan alur:
   - MEMAHAMI: Konsep, latar belakang masalah, regulasi, dasar pertimbangan keputusan.
   - MENGAPLIKASI: Tindakan nyata mentor, langkah konkret, strategi implementasi, pelibatan dewan guru/komite.
   - MEREFLEKSI: Makna dan inspirasi bagi BCKS, pembelajaran kepemimpinan, rencana adaptasi di satuan pendidikan asal.
4. CAKUPAN 5 KOMPETENSI UTAMA:
   - Kepribadian (integritas, keteladanan, kedewasaan emosi, growth mindset)
   - Manajerial (perencanaan berbasis data PBD, RKS/RKAS, pengelolaan SDM & sarpras, monev)
   - Kewirausahaan (inovasi sekolah, kemitraan, pemecahan masalah kreatif)
   - Supervisi (supervisi akademik berdiferensiasi, teknik coaching guru, tindak lanjut PKB)
   - Sosial (kolaborasi pemangku kepentingan, komite, orang tua, DUDI untuk SMK)
5. 8 STRATEGI PENDAMPINGAN: Shadowing, Kolaborasi Inkuiri, FGD, Wawancara, Observasi, Studi Kasus, Studi Dokumen, Simulasi.
6. ALUR 4 HARI KUNJUNGAN:
   - Hari 1 (6 JP): Kepribadian & Kewirausahaan (Rapat Dewan Guru, Shadowing, Growth Mindset, Pengambilan Keputusan).
   - Hari 2 (8 JP): Pengelolaan Sekolah Jilid 1 (Visioning, PBD, Rapor Pendidikan, RKS/RKAS) / Kunjungan DUDI untuk SMK.
   - Hari 3 (8 JP): Pengelolaan Sekolah Jilid 2 (Pengelolaan Sumber Daya, Monitoring, Evaluasi Program).
   - Hari 4 (6 JP): Supervisi Akademik (Pra, Observasi, Pasca-Coaching, Rencana Tindak Lanjut).
7. PELAPORAN LMS: Pengisian seluruh LK secara komprehensif berfungsi sebagai Laporan Singkat Kunjungan Sekolah 20 JP yang diunggah ke LMS untuk penilaian Pengajar Diklat.

Gunakan bahasa Indonesia yang santun, edukatif, berbobot, berbasis terminologi Kemendikbudristek/Ditjen GTK (seperti PBD, Rapor Pendidikan, Coaching Alur TIRTA, Growth Mindset, Kepemimpinan Pembelajaran).

- Konteks Kasus / Situasi Sekolah: "${r||`Mengamati keberhasilan inovasi sekolah dan keteladanan kepemimpinan`}"

PRINSIP WAJIB:
- Murni pertanyaan TERBUKA (menggunakan kata tanya: Bagaimana, Mengapa, Sejauh mana, Ceritakan proses...).
- HINDARI pertanyaan tertutup (Apakah/Sudahkah) yang hanya dijawab Ya/Tidak.
- HINDARI pertanyaan bernada mengaudit, menguji, atau mencari kelemahan sekolah.
- Gunakan pendekatan Inkuiri Apresiatif (menggali kekuatan, mimpi, desain, dan eksekusi).

SUSUN PERTANYAAN DALAM 4 TINGKATAN:
1. Pertanyaan Pemantik / Penghubung Emosi (Membangun rasa nyaman & apresiasi awal)
2. Pertanyaan Eksplorasi Proses (Menggali bagaimana KS mentor/guru merancang strategi dan melibatkan tim)
3. Pertanyaan Pendalaman Bukti Nyata / Probing (Menggali cara menghadapi resistensi/tantangan dengan pola pikir bertumbuh)
4. Pertanyaan Reflektif Makna (Menggali nilai kebajikan, filosofi kepemimpinan, dan pesan bijak bagi BCKS)

      <div class="statement-box">
        <strong>Pernyataan Integritas Kunjungan Sekolah:</strong><br/>
        Kegiatan kunjungan sekolah selama 20 JP ini dilaksanakan <strong>BUKAN DALAM RANGKA MENILAI ATAU MENGINSPEKSI</strong> baik atau buruknya sekolah mentor, melainkan wahana pembelajaran bermakna untuk menggali inspirasi nyata praktik baik, keteladanan kepribadian, pola pikir bertumbuh (growth mindset), tata kelola perencanaan berbasis data (PBD), dan supervisi akademik humanis berbasis coaching. Seluruh analisis disusun menggunakan alur tiga tahap pembelajaran mendalam: <strong>Memahami</strong>, <strong>Mengaplikasi</strong>, dan <strong>Merefleksi</strong> sesuai standar Buku Panduan Diklat BCKS 2026.

:`Petik nilai filosofisnya untuk direfleksikan ke dalam LK-3a dan LK-4.`}]},{id:`ks-pengambilan-keputusan`,targetRole:`Kepala Sekolah Mentor`,theme:`Pengambilan Keputusan Berbasis Nilai Kebajikan & Dilema Etika`,description:`Membedah pertimbangan moral, analisis paradigma benar vs benar, dan investigasi opsi trilema yang diambil kepala sekolah.`,competencies:[`Kepribadian`,`Manajerial`],dayNumber:1,questions:[{stage:`Pemantik / Penghubung`,questionText:`Dilema kepemimpinan seperti apa yang paling menantang nurani yang pernah Ibu/Bapak hadapi selama bertugas di sekolah ini?`,probingTips:`Jaga kerahasiaan identitas pihak terkait, fokus pada dinamika pertimbangan nilai.`},{stage:`Eksplorasi Proses`,questionText:`Saat berada di antara dua pilihan yang sama-sama benar (misalnya antara rasa kasihan terhadap guru vs penegakan aturan kedisiplinan), bagaimana langkah musyawarah yang Ibu/Bapak tempuh?`,probingTips:`Kaitkan dengan 4 paradigma etika (Individu vs Kelompok, Rasa Keadilan vs Kasihan, Kebenaran vs Kesetiaan, Jangka Pendek vs Panjang).`},{stage:`Pendalaman Probing`,questionText:`Bagaimana proses Ibu/Bapak menemukan "opsi ketiga" (trilema) yang kreatif sehingga keputusan tersebut tetap menjunjung tinggi kepentingan murid tanpa meretakkan hubungan kerja?`,probingTips:`Cermati teknik komunikasi asertif yang memberdayakan.`},{stage:`Refleksi Kepemimpinan`,questionText:`Pelajaran berharga apa yang Ibu/Bapak wariskan kepada kami para calon kepala sekolah tentang memikul tanggung jawab atas dampak suatu keputusan yang tidak populer?`,probingTips:`Catat sebagai bahan refleksi komitmen kepemimpinan etis di sekolah masa depan.`}]},{id:`ks-pbd-rapor-pendidikan`,targetRole:`Kepala Sekolah Mentor`,theme:`Perencanaan Berbasis Data (PBD) & Rapor Pendidikan`,description:`Menelusuri bagaimana sekolah membaca data autentik Rapor Pendidikan dan menerjemahkannya ke dalam program RKS dan ARKAS.`,competencies:[`Manajerial`,`Sosial`],dayNumber:2,questions:[{stage:`Pemantik / Penghubung`,questionText:`Bagaimana perasaan dan respon awal seluruh warga sekolah saat bersama-sama pertama kali membuka platform Rapor Pendidikan sekolah ini?`,probingTips:`Gali iklim transparansi dan keterbukaan sekolah menerima data.`},{stage:`Eksplorasi Proses`,questionText:`Bagaimana alur kerja Tim Pengembang Sekolah (TPS) dalam membedah indikator akar masalah (D1 s/d D8) sehingga tidak terjebak hanya mengobati gejala permukaan?`,probingTips:`Minta ditunjukkan contoh lembar Identifikasi, Refleksi, Benahi (IRB).`},{stage:`Pendalaman Probing`,questionText:`Bagaimana strategi Ibu/Bapak menyelaraskan program prioritas Benahi ke dalam keterbatasan pos pagu anggaran ARKAS tanpa memangkas kebutuhan esensial murid?`,probingTips:`Cari tahu bagaimana sekolah memanfaatkan aset non-finansial untuk mendukung program Benahi.`},{stage:`Refleksi Kepemimpinan`,questionText:`Sejauh mana budaya berbasis data ini mengubah kebiasaan lama sekolah yang dahulu menyusun RKAS hanya dengan metode "copy-paste" tahun lalu?`,probingTips:`Gunakan respons ini untuk pengisian Rev_LK 2.6 Jilid 1.`}]},{id:`ks-sumberdaya-monev`,targetRole:`Kepala Sekolah Mentor`,theme:`Pengelolaan Sumber Daya & Sistem Monitoring Evaluasi (Monev)`,description:`Mengamati tata kelola 7 aset modal sekolah, sistem pemeliharaan sarpras, dan pemantauan program yang berkelanjutan.`,competencies:[`Manajerial`,`Kewirausahaan`],dayNumber:3,questions:[{stage:`Pemantik / Penghubung`,questionText:`Aset modal apa di lingkungan sekolah ini yang awalnya dipandang biasa saja atau bahkan dianggap masalah, namun berhasil diubah menjadi potensi kekuatan besar?`,probingTips:`Kaitkan dengan pendekatan berbasis aset (Asset-Based Community Development / PKBA).`},{stage:`Eksplorasi Proses`,questionText:`Bagaimana siklus monitoring berkala yang Ibu/Bapak terapkan untuk memastikan sarana prasarana sekolah tetap terpelihara aman dan ramah bagi seluruh murid?`,probingTips:`Periksa dokumen SOP pemeliharaan dan papan kontrol inventaris.`},{stage:`Pendalaman Probing`,questionText:`Bagaimana mekanisme evaluasi tengah semester dijalankan agar tim guru merasa didukung dan diapresiasi kinerjanya, bukan dihakimi atas keterlambatan target?`,probingTips:`Amati bentuk apresiasi non-finansial yang diberikan pimpinan.`},{stage:`Refleksi Kepemimpinan`,questionText:`Apa kunci utama kepemimpinan Ibu/Bapak dalam membangun akuntabilitas yang tinggi sekaligus menjaga iklim kerja yang penuh kekeluargaan dan kepercayaan?`,probingTips:`Bahan utama pengisian Rev_LK 2.7 Jilid 2.`}]},{id:`ks-supervisi-coaching`,targetRole:`Kepala Sekolah Mentor`,theme:`Supervisi Akademik Berkelanjutan & Coaching Alur TIRTA`,description:`Mendalami pergeseran supervisi dari pengawasan administratif menjadi percakapan reflektif yang memberdayakan potensi guru.`,competencies:[`Supervisi`,`Kepribadian`,`Sosial`],dayNumber:4,questions:[{stage:`Pemantik / Penghubung`,questionText:`Bagaimana cara Ibu/Bapak menghilangkan rasa cemas atau ketegangan guru sebelum memasuki siklus supervisi akademik di kelas?`,probingTips:`Cermati bahasa tubuh dan suasana saat percakapan pra-observasi.`},{stage:`Eksplorasi Proses`,questionText:`Dalam percakapan pasca-observasi, bagaimana langkah Ibu/Bapak memandu guru menggunakan alur TIRTA agar guru sendiri yang menemukan solusi atas tantangan mengajarnya?`,probingTips:`Fokus pada teknik bertanya yang memberdayakan alih-alih memberi resep/nasihat.`},{stage:`Pendalaman Probing`,questionText:`Bagaimana data hasil supervisi akademik ini ditindaklanjuti secara nyata ke dalam kegiatan Komunitas Belajar (Kombel) atau pemanfaatan PMM di sekolah?`,probingTips:`Minta ditunjukkan dokumen rekap program tindak lanjut PKB.`},{stage:`Refleksi Kepemimpinan`,questionText:`Apa perubahan paling membahagiakan yang Ibu/Bapak saksikan pada antusiasme belajar murid setelah para guru merasakan manfaat supervisi yang memberdayakan?`,probingTips:`Intisari penting untuk Instrumen Pengamatan Supervisi & LK 5.2.1.`}]},{id:`guru-tendik-kombel`,targetRole:`Dewan Guru & Tendik`,theme:`Iklim Kolaborasi Pembelajaran & Kepemimpinan Memberdayakan`,description:`Mewawancarai guru secara empatik untuk menggali dampak keteladanan kepala sekolah terhadap kenyamanan dan kemerdekaan mengajar.`,competencies:[`Sosial`,`Kepribadian`,`Supervisi`],dayNumber:1,questions:[{stage:`Pemantik / Penghubung`,questionText:`Apa yang membuat Bapak/Ibu guru merasa paling bersemangat dan nyaman datang mengajar di sekolah ini setiap paginya?`,probingTips:`Dengarkan dengan tulus ekspresi kepuasan kerja guru.`},{stage:`Eksplorasi Proses`,questionText:`Bagaimana dukungan yang diberikan kepala sekolah ketika Bapak/Ibu guru ingin mencoba metode mengajar baru atau media pembelajaran yang belum pernah dipakai?`,probingTips:`Gali apakah pimpinan memberi ruang aman untuk gagal dan mencoba lagi.`},{stage:`Pendalaman Probing`,questionText:`Bagaimana suasana diskusi yang tercipta di Komunitas Belajar (Kombel) sekolah saat para guru saling berbagi praktik baik atau membedah kendala belajar murid?`,probingTips:`Amati apakah ada senioritas ataukah kesetaraan saling belajar.`},{stage:`Refleksi Kepemimpinan`,questionText:`Sikap keteladanan apa dari Kepala Sekolah yang paling membekas di hati Bapak/Ibu guru dan memotivasi untuk terus berprestasi?`,probingTips:`Catat verbatim kalimat guru sebagai bukti autentik praktik baik keteladanan KS.`}]},{id:`komite-orangtua`,targetRole:`Komite Sekolah & Orang Tua`,theme:`Kemitraan Gotong Royong & Partisipasi Masyarakat`,description:`Mendalami bagaimana kepala sekolah membangun komunikasi transparan dan menggerakkan modal sosial masyarakat.`,competencies:[`Sosial`,`Kewirausahaan`],dayNumber:2,questions:[{stage:`Pemantik / Penghubung`,questionText:`Bagaimana awal mula terjalinnya hubungan yang begitu harmonis dan saling mendukung antara pihak sekolah dengan komite dan paguyuban orang tua?`,probingTips:`Pahami titik tolak keterbukaan sekolah.`},{stage:`Eksplorasi Proses`,questionText:`Bagaimana sekolah melibatkan komite dan orang tua dalam mendiskusikan program-program sekolah serta transparansi pemanfaatan dana bantuan masyarakat?`,probingTips:`Cermati jadwal pertemuan rutin dan kanal komunikasi WhatsApp/forum tatap muka.`},{stage:`Pendalaman Probing`,questionText:`Ketika terjadi kesalahpahaman atau kekhawatiran orang tua terkait suatu kebijakan sekolah, bagaimana cara kepala sekolah menjembatani dialog musyawarah?`,probingTips:`Fokus pada strategi pencegahan konflik dan keterbukaan menerima saran.`},{stage:`Refleksi Kepemimpinan`,questionText:`Apa harapan terbesar komite sekolah terhadap kesinambungan budaya positif yang telah dirintis oleh kepala sekolah mentor saat ini?`,probingTips:`Bahan refleksi pentingnya kemitraan sosial yang inklusif.`}]},{id:`dudi-khusus-smk`,targetRole:`Mitra DUDI (Khusus SMK)`,theme:`Sinkronisasi Kurikulum Industri, TeFa, & Serapan Lulusan`,description:`Khusus Kunjungan SMK: Menggali keselarasan kompetensi kejuruan dengan standar operasional dunia kerja nyata.`,competencies:[`Kewirausahaan`,`Manajerial`,`Sosial`],dayNumber:2,questions:[{stage:`Pemantik / Penghubung`,questionText:`Apa daya tarik dan keunggulan utama dari SMK mitra yang membuat perusahaan/industri Bapak/Ibu berkomitmen menjalin kemitraan jangka panjang?`,probingTips:`Gali reputasi lulusan dan kepemimpinan visioner KS.`},{stage:`Eksplorasi Proses`,questionText:`Bagaimana proses penyelarasan kurikulum kejuruan dilakukan bersama antara pihak sekolah dengan instruktur industri agar sesuai perkembangan teknologi terkini?`,probingTips:`Minta penjelasan mengenai program Teaching Factory (TeFa) dan magang guru.`},{stage:`Pendalaman Probing`,questionText:`Karakter kerja dan soft skills apa (seperti kedisiplinan, keselamatan kerja 5R, etos kerja) yang paling diapresiasi industri dari para siswa saat Praktik Kerja Lapangan (PKL)?`,probingTips:`Kaitkan dengan pembentukan karakter Profil Pelajar Pancasila.`},{stage:`Refleksi Kepemimpinan`,questionText:`Saran strategis apa yang dapat diberikan bagi calon kepala sekola
